; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; Environments:
;   pico    Firmware for the Raspberry Pi Pico, and on-device tests (test/embedded)
;   native  Host unit tests for hardware-independent code (test/native)
;
; See docs/TESTING.md for how to run the tests.

[env]
test_framework = unity
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
; Obsolete custom network stack, replaced by the core's lwIP W5500 driver
lib_ignore =
    w5500
    network

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
board_build.filesystem = littlefs
board_build.filesystem_size = 0.25m
board_build.filesystem_dir = data

test_filter = embedded/*
test_build_src = no

build_unflags =
    -Os

upload_port = COM16
monitor_port = COM16
monitor_speed = 115200
test_port = COM16
test_speed = 115200
; Wait for the USB serial port to return after flashing, so `pio test` can open it
extra_scripts = post:scripts/wait_for_port.py

[env:native]
platform = native
test_filter = native/*
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Werror
; Only the hardware-independent libraries build on the host
lib_ignore =
    ${env.lib_ignore}
    settings
